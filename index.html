</style></head><body><article id="4cbfac7e-9b68-4852-a2ab-2193bd485c4d" class="page sans"><header><img class="page-cover-image" src="header.jpg" style="object-position:center 70.46%"/><div class="page-header-icon page-header-icon-with-cover"><img class="icon" src="pycubed_small.png"/></div><h1 class="page-title">PyCubed</h1><p class="page-description"></p></header><div class="page-body"><p id="e7b1bba8-be4e-4102-9502-5d9275c2c175" class="block-color-gray">An Open-Source, Radiation-Tested SmallSat Framework Programmable Entirely in Python.<br/><br/></p><figure id="c94b1409-fefd-4dd0-99ee-5ce667f6c83f" class="image"><a href="pycubed.jpg"><img style="width:707.9971313476562px" src="pycubed.jpg"/></a></figure><p id="1b50dd8f-6b57-44d4-b96e-4ac101b5d86f" class="">
</p><figure class="block-color-teal_background callout" style="white-space:pre-wrap;display:flex" id="9003bcb6-78a9-4ed0-93d3-7bc29ab07c70"><div style="font-size:1.5em"><span class="icon">⭐</span></div><div style="width:100%">Have a board and ready to get started? See <a href="Hands-On%20Quick%20Start%20d220f0ec88eb41c08ee855ff4f46d737.html"><span class="icon">⚡</span>Hands-On Quick Start</a> </div></figure><p id="7852848e-330c-4674-8d05-1ec06c8be3cb" class="">
</p><div><figure class="block-color-red_background callout" style="white-space:pre-wrap;display:flex" id="541303b9-6a67-4bf8-bb7b-a5c090a9004e"><div style="font-size:1.5em"><span class="icon">⚠️</span></div><div style="width:100%"><strong><span style="border-bottom:0.05em solid">NOTICE - AUGUST 1 2024</span></strong><p id="5e681058-979c-4589-8d7f-68da955feb8f" class="">We have found the ATSAMD51 microcontroller used on PyCubed Mainboards (v00 - v05) exhibiting a surprisingly high sensitivity to 50MeV protons. Our KickSat-2 and VR3X missions had zero issues with the ATSAMD51 and the part does have some radiation literature. But after troubleshooting unexplained reboots on our recent PY4 mission, we decided to test it ourselves. </p><ul id="35315ba1-f142-44f9-abeb-9ece2d350ee6" class="toggle"><li><details open=""><summary>More details:</summary><p id="f97e9599-a448-48b3-b9d5-f9e206175540" class="">It&#x27;s quite possible the ATSAMD51 has undergone some manufacturing changes in the nearly 10 years since it was selected for PyCubed that introduced new avenues for rad susceptibility (atmel acquired by microchip, chip shortage shaking up fab availability, etc). Additionally, much of our personal flight heritage with the part has been during different periods of the solar cycle and not subject to the high bursts of proton fluxes currently observed in the 2024 solar maximum. </p><p id="3d6289f0-aa7f-4fb6-b244-c277204eeb0e" class="">In our testing, all of our test articles (all use ATSAMD51 with date codes within the past two years) will consistently experience latch-up of one or more peripherals when exposed to 50MeV protons to a fluence of 5E8 p/cm2 or less. We saw this manifest as many things such as halted serial communication (SPI/I2C/UART) but continued external watchdog PWM, or latch-up of certain GPIO power domains (groups of pins) while continued operation of others. Suffice to say when we release a v06 PyCubed mainboard design, it will not utilize the ATSAMD51 microcontroller.  </p><p id="96e37180-352d-48c2-a567-739b46e15a8d" class="">It is worth mentioning that, with the culprit ATSAMD51 masked from the beam, the remainder of the PyCubed bus operated without issue under accelerated exposure until we ran out of time on the beam (equivalent to multiple years on orbit). </p><p id="4ac3117f-5dcd-44f5-bbdd-e718278943d9" class="block-color-yellow_background">NOTE: We are posting this summary to notify the community as quickly as possible. These are just preliminary findings, interpret it however you wish. </p><p id="fc04da45-3441-4168-880c-690a04c0ee7e" class=""><a href="https://github.com/pycubed/forums/discussions/87">➡️ link to forum discussion</a></p></details></li></ul></div></figure></div><p id="90866c13-45eb-4a43-ab78-a90d520e734e" class="">
</p><hr id="a34df37c-b2c9-48b0-85d7-c1372e4ba856"/><div id="91a48faa-87a0-48fc-8e4b-aa6b03359b52" class="column-list"><div id="57244e25-9dec-4cb7-95b9-06e60e7ac2e0" style="width:50%" class="column"><figure id="f257a98e-c600-4453-8d8f-bdc20fec987f" class="link-to-page"><a href="What%20is%20PyCubed%20f257a98ec60044538d8fbdc20fec987f.html"><span class="icon">💡</span>What is PyCubed?</a></figure><figure id="8921489e-5168-447d-80b9-f68fa7856a50" class="link-to-page"><a href="Hardware%208921489e5168447d80b9f68fa7856a50.html"><span class="icon">⚙</span>Hardware</a></figure><figure id="4c567185-3de6-48d6-adce-edceaa088a81" class="link-to-page"><a href="Software%20&amp;%20Firmware%204c5671853de648d6adceedceaa088a81.html"><span class="icon">💾</span>Software &amp; Firmware</a></figure></div><div id="a5771172-1299-4703-9106-ea7202c6647f" style="width:49.99999999999999%" class="column"><figure id="8738cab0-dd07-4323-9a3c-de30c6066452" class="block-color-yellow_background link-to-page"><a href="All%20PyCubed%20Resources%208738cab0dd0743239a3cde30c6066452.html"><span class="icon">🗃️</span>All PyCubed Resources</a></figure><p id="eac243f2-9ca6-434d-99d8-723c6f14fcf1" class="">💬 <a href="https://pycubed.org/forums">PyCubed Forums</a></p><figure id="70e805a6-0ad6-45fa-9ed7-383afebe1305" class="link-to-page"><a href="Contact%20Us%2070e805a60ad645fa9ed7383afebe1305.html"><span class="icon">📧</span>Contact Us</a></figure></div></div><hr id="3c3784c7-7e65-4e25-97fb-59b1f02c7100"/><p id="4c241ba5-7bab-449f-aa56-350f169b3b89" class=""><br/><br/></p><div id="263005cd-26ca-4efd-b6a7-b3bcd60156ad" class="collection-content"><h4 class="collection-title">Missions</h4><table class="collection-content"><thead><tr><th><span class="icon property-icon"><svg role="graphics-symbol" viewBox="0 0 16 16" style="width:14px;height:14px;display:block;fill:rgba(55, 53, 47, 0.45);flex-shrink:0" class="typesTitle"><path d="M0.637695 13.1914C1.0957 13.1914 1.32812 13 1.47852 12.5215L2.24414 10.3887H6.14746L6.90
